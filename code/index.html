<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>stats preview card component</title>
  </head>
  <body>
    <main class="component">
      <section class="picture">
        <img
          src="../images/image-header-mobile.jpg"
          alt="header image for mobile"
        />
      </section>

      <section class="section-text">
        <h1 class="heading">
          Get
          <span class="highlight-text">isnights </span>
          that help your business grow.
        </h1>

        <p class="text">
          Discover the benefits of data analytics and make better decisions
          regarding revenue, customer experience, and overall efficiency.
        </p>

        <aside class="info">
          <div class="deatils">
            <p class="numbers">10K+</p>
            <p class="meaning">Companies</p>
          </div>

          <div class="deatils">
            <p class="numbers">314</p>
            <p class="meaning">Templates</p>
          </div>

          <div class="deatils">
            <p class="numbers">12M+</p>
            <p class="meaning">Queries</p>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
